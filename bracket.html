<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0a1628">
  <title>Playoff Bracket - Overdrive Scorekeeper</title>
  <link rel="manifest" href="manifest.json">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-dark: #0a1628;
      --bg-gradient: linear-gradient(135deg, #0a1628 0%, #1a3a5c 100%);
      --red-alliance: #dc3545;
      --red-alliance-bg: rgba(220, 53, 69, 0.3);
      --blue-alliance: #0d6efd;
      --blue-alliance-bg: rgba(13, 110, 253, 0.3);
      --accent-yellow: #ffc107;
      --accent-green: #28a745;
      --text-primary: #ffffff;
      --text-secondary: rgba(255, 255, 255, 0.7);
      --text-muted: rgba(255, 255, 255, 0.4);
      --match-bg: #1e3a5f;
      --match-border: #2a5080;
      --winner-highlight: #ffd700;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-gradient);
      min-height: 100vh;
      color: var(--text-primary);
      overflow-x: auto;
    }

    .bracket-container {
      padding: 20px;
      min-width: 900px;
    }

    .bracket-header {
      text-align: center;
      margin-bottom: 30px;
    }

    .bracket-header h1 {
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .connection-status {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .connection-status.online {
      background: var(--accent-green);
    }

    .connection-status.offline {
      background: var(--red-alliance);
    }

    /* =====================
       BRACKET GRID LAYOUT
       ===================== */

    .bracket-grid {
      position: relative;
      display: flex;
      flex-direction: column;
      max-width: 1400px;
      margin: 0 auto;
      padding: 20px;
    }

    /* Round labels row */
    .round-labels-row {
      display: flex;
      justify-content: center;
      gap: 40px;
      margin-bottom: 20px;
    }

    .round-label {
      width: 160px;
      text-align: center;
      font-size: 0.9rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--text-secondary);
      padding: 8px 0;
      border-bottom: 2px solid var(--match-border);
    }

    /* Rounds container */
    .rounds-container {
      display: flex;
      justify-content: center;
      gap: 40px;
      align-items: stretch;
    }

    .rounds-container.finals-only {
      justify-content: center;
    }

    /* Round column */
    .round-column {
      display: flex;
      flex-direction: column;
      justify-content: space-around;
      gap: 20px;
      min-height: 200px;
    }

    .round-column.finals-round {
      justify-content: center;
    }

    /* Match wrapper for positioning */
    .match-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 80px;
    }

    /* Dynamic column heights based on bracket size */
    .bracket-4 .rounds-container { min-height: 300px; }
    .bracket-4 .round-column[data-round="1"] { justify-content: space-around; }
    .bracket-4 .round-column[data-round="2"] { justify-content: space-around; }
    .bracket-4 .round-column[data-round="3"] { justify-content: center; }

    .bracket-6 .rounds-container { min-height: 350px; }
    .bracket-6 .round-column[data-round="1"],
    .bracket-6 .round-column[data-round="2"],
    .bracket-6 .round-column[data-round="3"],
    .bracket-6 .round-column[data-round="4"] { justify-content: space-around; }
    .bracket-6 .round-column[data-round="5"] { justify-content: center; }

    .bracket-8 .rounds-container { min-height: 500px; }
    .bracket-8 .round-column[data-round="1"],
    .bracket-8 .round-column[data-round="2"] { justify-content: space-around; }
    .bracket-8 .round-column[data-round="3"],
    .bracket-8 .round-column[data-round="4"] { justify-content: space-around; }
    .bracket-8 .round-column[data-round="5"] { justify-content: center; }

    /* Match box styling */
    .match-box {
      width: 160px;
      background: var(--match-bg);
      border: 2px solid var(--match-border);
      border-radius: 8px;
      overflow: hidden;
      transition: all 0.3s;
      position: relative;
      z-index: 2;
    }

    .match-box.current {
      border-color: var(--accent-yellow);
      box-shadow: 0 0 20px rgba(255, 193, 7, 0.4);
    }

    .match-box.completed {
      opacity: 0.85;
    }

    .match-box.conditional {
      border-style: dashed;
    }

    .match-header {
      background: rgba(0, 0, 0, 0.3);
      padding: 6px 10px;
      text-align: center;
      font-weight: 700;
      font-size: 0.85rem;
      border-bottom: 1px solid var(--match-border);
    }

    /* Alliance slot styling */
    .alliance-slot {
      padding: 8px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--match-border);
      transition: all 0.3s;
    }

    .alliance-slot:last-child {
      border-bottom: none;
    }

    /* Red slot - always red colored */
    .alliance-slot.red {
      background: var(--red-alliance-bg);
      border-left: 4px solid var(--red-alliance);
    }

    /* Blue slot - always blue colored */
    .alliance-slot.blue {
      background: var(--blue-alliance-bg);
      border-left: 4px solid var(--blue-alliance);
    }

    /* TBD slot - muted */
    .alliance-slot.tbd {
      background: rgba(255, 255, 255, 0.05);
      border-left-color: var(--text-muted);
      color: var(--text-muted);
    }

    /* From winner - keeps slot color but adds indicator */
    .alliance-slot.from-winner {
      /* Keep red/blue color based on slot */
    }

    /* From loser - keeps slot color but adds indicator */
    .alliance-slot.from-loser {
      /* Keep red/blue color based on slot */
    }

    /* Winner of match - gold highlight */
    .alliance-slot.winner {
      background: rgba(255, 215, 0, 0.25) !important;
      border-left-color: var(--winner-highlight) !important;
    }

    .alliance-slot.winner .alliance-name {
      color: var(--winner-highlight);
      font-weight: 700;
    }

    .alliance-name {
      font-weight: 600;
      font-size: 0.85rem;
    }

    .winner-icon {
      font-size: 0.9rem;
      color: var(--winner-highlight);
    }

    /* SVG Connector Lines */
    .bracket-connectors {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .connector-line {
      stroke-width: 2;
      fill: none;
    }

    .connector-line.connector-red {
      stroke: var(--red-alliance);
      opacity: 0.6;
    }

    .connector-line.connector-blue {
      stroke: var(--blue-alliance);
      opacity: 0.6;
    }

    .connector-arrow {
      opacity: 0.8;
    }

    .connector-arrow.connector-red {
      fill: var(--red-alliance);
    }

    .connector-arrow.connector-blue {
      fill: var(--blue-alliance);
    }

    /* Champion display */
    .champion-display {
      text-align: center;
      padding: 30px;
      background: linear-gradient(135deg, rgba(255, 215, 0, 0.2) 0%, rgba(255, 193, 7, 0.1) 100%);
      border-radius: 16px;
      border: 2px solid var(--winner-highlight);
      margin-top: 30px;
      max-width: 400px;
      margin-left: auto;
      margin-right: auto;
    }

    .champion-trophy {
      font-size: 4rem;
      margin-bottom: 10px;
    }

    .champion-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--winner-highlight);
      margin-bottom: 10px;
    }

    .champion-teams {
      font-size: 1.2rem;
      color: var(--text-primary);
    }

    /* No bracket message */
    .no-bracket {
      text-align: center;
      padding: 100px 20px;
      color: var(--text-secondary);
    }

    .no-bracket h2 {
      font-size: 2rem;
      margin-bottom: 20px;
    }

    .no-bracket p {
      font-size: 1.1rem;
    }

    /* Fullscreen button */
    .fullscreen-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: white;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.2s;
      z-index: 100;
    }

    .fullscreen-btn:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    /* Back link */
    .back-link {
      position: fixed;
      top: 20px;
      left: 20px;
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 0.9rem;
      padding: 8px 16px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      transition: all 0.2s;
      z-index: 100;
    }

    .back-link:hover {
      background: rgba(255, 255, 255, 0.2);
      color: var(--text-primary);
    }

    /* 2-alliance best of 3 specific styles */
    .bracket-2 .rounds-container {
      min-height: auto;
    }

    .bracket-2 .round-column {
      gap: 15px;
    }

    .bracket-2 .match-wrapper {
      min-height: auto;
    }
  </style>
</head>
<body>
  <a href="index.html" class="back-link">Back to Home</a>

  <div class="bracket-container">
    <header class="bracket-header">
      <h1>Playoff Bracket</h1>
      <span id="connection-status" class="connection-status offline">Checking...</span>
    </header>

    <div id="bracket-content">
      <div class="no-bracket">
        <h2>No Bracket Yet</h2>
        <p>The playoff bracket will appear here once it's generated in the admin panel.</p>
      </div>
    </div>
  </div>

  <button class="fullscreen-btn" onclick="toggleFullscreen()">Fullscreen (F)</button>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

  <!-- App Scripts -->
  <script src="js/firebase-config.js"></script>
  <script src="js/db.js"></script>
  <script src="js/bracket.js"></script>
  <script src="js/bracket-display.js"></script>

  <script>
    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => {
          console.log("Fullscreen error:", err);
        });
      } else {
        document.exitFullscreen();
      }
    }

    document.addEventListener("keydown", (e) => {
      if (e.key === "f" || e.key === "F") {
        toggleFullscreen();
      }
    });
  </script>
</body>
</html>
