<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0a1628">
  <title>Playoff Bracket - Overdrive Scorekeeper</title>
  <link rel="manifest" href="manifest.json">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-dark: #0a1628;
      --bg-gradient: linear-gradient(135deg, #0a1628 0%, #1a3a5c 100%);
      --red-alliance: #dc3545;
      --blue-alliance: #0d6efd;
      --accent-yellow: #ffc107;
      --accent-green: #28a745;
      --text-primary: #ffffff;
      --text-secondary: rgba(255, 255, 255, 0.7);
      --text-muted: rgba(255, 255, 255, 0.4);
      --match-bg: #1e3a5f;
      --match-border: #2a5080;
      --winner-highlight: #ffd700;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-gradient);
      min-height: 100vh;
      color: var(--text-primary);
      overflow-x: auto;
    }

    .bracket-container {
      padding: 20px;
      min-width: 1200px;
    }

    .bracket-header {
      text-align: center;
      margin-bottom: 30px;
    }

    .bracket-header h1 {
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .connection-status {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .connection-status.online {
      background: var(--accent-green);
    }

    .connection-status.offline {
      background: var(--red-alliance);
    }

    /* =====================
       NEW BRACKET GRID LAYOUT
       ===================== */

    .bracket-grid {
      display: flex;
      flex-direction: column;
      gap: 20px;
      padding: 20px 40px;
    }

    /* Section headers */
    .bracket-section-header {
      font-size: 1rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 3px;
      color: var(--text-muted);
      padding: 10px 0;
      border-bottom: 1px solid var(--match-border);
      margin-top: 20px;
    }

    .bracket-section-header.upper {
      margin-top: 0;
    }

    /* Round labels */
    .bracket-labels {
      display: flex;
      gap: 60px;
      padding-left: 20px;
      margin-bottom: 10px;
    }

    .bracket-labels span {
      width: 180px;
      text-align: center;
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-secondary);
    }

    /* Upper and Lower bracket containers */
    .upper-bracket,
    .lower-bracket {
      display: flex;
      gap: 60px;
      padding-left: 20px;
      position: relative;
    }

    /* Bracket column containing matches */
    .bracket-column {
      display: flex;
      flex-direction: column;
      justify-content: space-around;
      position: relative;
    }

    /* Match slots - controls vertical positioning */
    .match-slot {
      position: relative;
      display: flex;
      align-items: center;
    }

    /* Connector lines */
    .connector-right {
      position: absolute;
      right: -60px;
      width: 60px;
      height: 50%;
      border: 2px solid var(--match-border);
      border-left: none;
    }

    .connector-right:not(.flip):not(.straight) {
      top: 50%;
      border-bottom: none;
      border-radius: 0 8px 0 0;
    }

    .connector-right.flip {
      bottom: 50%;
      border-top: none;
      border-radius: 0 0 8px 0;
    }

    .connector-right.straight {
      height: 0;
      top: 50%;
      border-top: none;
      border-bottom: none;
      border-radius: 0;
    }

    /* Finals column - positioned to the right */
    .finals-column {
      position: absolute;
      right: 40px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .finals-label {
      font-size: 1rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--text-secondary);
    }

    /* Specific bracket sizing */

    /* 4-alliance bracket */
    .bracket-4 .upper-bracket {
      min-height: 200px;
    }

    .bracket-4 .lower-bracket {
      min-height: 100px;
    }

    .bracket-4 .upper-bracket .round-1 {
      height: 200px;
    }

    .bracket-4 .upper-bracket .round-1 .match-slot {
      flex: 1;
      display: flex;
      align-items: center;
    }

    .bracket-4 .upper-bracket .round-2 {
      height: 200px;
      justify-content: center;
    }

    .bracket-4 .lower-bracket .bracket-column {
      height: 100px;
      justify-content: center;
    }

    /* 6-alliance bracket */
    .bracket-6 .upper-bracket {
      min-height: 200px;
    }

    .bracket-6 .lower-bracket {
      min-height: 200px;
    }

    .bracket-6 .upper-bracket .round-1,
    .bracket-6 .upper-bracket .round-2 {
      height: 200px;
    }

    .bracket-6 .upper-bracket .round-1 .match-slot,
    .bracket-6 .upper-bracket .round-2 .match-slot {
      flex: 1;
      display: flex;
      align-items: center;
    }

    .bracket-6 .upper-bracket .round-3 {
      height: 200px;
      justify-content: center;
    }

    .bracket-6 .lower-bracket .round-1 {
      height: 200px;
    }

    .bracket-6 .lower-bracket .round-1 .match-slot {
      flex: 1;
      display: flex;
      align-items: center;
    }

    .bracket-6 .lower-bracket .round-2,
    .bracket-6 .lower-bracket .round-3 {
      height: 200px;
      justify-content: center;
    }

    /* 8-alliance bracket */
    .bracket-8 .upper-bracket {
      min-height: 400px;
    }

    .bracket-8 .lower-bracket {
      min-height: 200px;
    }

    .bracket-8 .upper-bracket .round-1 {
      height: 400px;
    }

    .bracket-8 .upper-bracket .round-1 .match-slot {
      flex: 1;
      display: flex;
      align-items: center;
    }

    .bracket-8 .upper-bracket .round-2 {
      height: 400px;
    }

    .bracket-8 .upper-bracket .round-2 .match-slot {
      flex: 1;
      display: flex;
      align-items: center;
    }

    .bracket-8 .upper-bracket .round-3 {
      height: 400px;
      justify-content: center;
    }

    .bracket-8 .lower-bracket .round-1,
    .bracket-8 .lower-bracket .round-2 {
      height: 200px;
    }

    .bracket-8 .lower-bracket .round-1 .match-slot,
    .bracket-8 .lower-bracket .round-2 .match-slot {
      flex: 1;
      display: flex;
      align-items: center;
    }

    .bracket-8 .lower-bracket .round-3,
    .bracket-8 .lower-bracket .round-4 {
      height: 200px;
      justify-content: center;
    }

    /* Bracket container needs to be relative for finals positioning */
    .bracket-grid {
      position: relative;
      padding-right: 300px; /* Space for finals column */
    }

    /* Match box styling */
    .match-box {
      width: 180px;
      background: var(--match-bg);
      border: 2px solid var(--match-border);
      border-radius: 8px;
      overflow: hidden;
      transition: all 0.3s;
    }

    .match-box.current {
      border-color: var(--accent-yellow);
      box-shadow: 0 0 20px rgba(255, 193, 7, 0.4);
    }

    .match-box.completed {
      opacity: 0.8;
    }

    .match-header {
      background: rgba(0, 0, 0, 0.3);
      padding: 6px 10px;
      text-align: center;
      font-weight: 700;
      font-size: 0.9rem;
      border-bottom: 1px solid var(--match-border);
    }

    .alliance-slot {
      padding: 10px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--match-border);
      transition: all 0.3s;
    }

    .alliance-slot:last-child {
      border-bottom: none;
    }

    .alliance-slot.red {
      background: rgba(220, 53, 69, 0.3);
      border-left: 4px solid var(--red-alliance);
    }

    .alliance-slot.blue {
      background: rgba(13, 110, 253, 0.3);
      border-left: 4px solid var(--blue-alliance);
    }

    .alliance-slot.tbd {
      background: rgba(255, 255, 255, 0.05);
      border-left: 4px solid var(--text-muted);
      color: var(--text-muted);
    }

    .alliance-slot.winner {
      background: rgba(255, 215, 0, 0.2);
      border-left-color: var(--winner-highlight);
    }

    .alliance-slot.winner .alliance-name {
      color: var(--winner-highlight);
      font-weight: 700;
    }

    .alliance-name {
      font-weight: 600;
      font-size: 0.95rem;
    }

    .winner-icon {
      font-size: 1rem;
    }

    /* Finals box */
    .finals-box {
      width: 220px;
      background: linear-gradient(135deg, #2a2a4a 0%, #1a1a3a 100%);
      border: 3px solid var(--match-border);
      border-radius: 12px;
    }

    .finals-box.current {
      border-color: var(--accent-yellow);
      box-shadow: 0 0 20px rgba(255, 193, 7, 0.4);
    }

    .finals-box .match-header {
      background: rgba(100, 100, 150, 0.3);
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: 2px;
    }

    .finals-wins {
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--winner-highlight);
      min-width: 20px;
      text-align: right;
    }

    .finals-status {
      text-align: center;
      padding: 6px 10px;
      font-size: 0.85rem;
      color: var(--text-secondary);
      background: rgba(0, 0, 0, 0.2);
      border-top: 1px solid var(--match-border);
    }

    /* Champion display */
    .champion-display {
      text-align: center;
      padding: 30px;
      background: linear-gradient(135deg, rgba(255, 215, 0, 0.2) 0%, rgba(255, 193, 7, 0.1) 100%);
      border-radius: 16px;
      border: 2px solid var(--winner-highlight);
      margin-top: 30px;
    }

    .champion-trophy {
      font-size: 4rem;
      margin-bottom: 10px;
    }

    .champion-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--winner-highlight);
      margin-bottom: 10px;
    }

    .champion-teams {
      font-size: 1.2rem;
      color: var(--text-primary);
    }

    /* Legacy styles for 2-alliance bracket */
    .round-labels {
      display: flex;
      justify-content: center;
      margin-bottom: 20px;
      padding: 0 50px;
    }

    .round-label {
      font-size: 1.1rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--text-secondary);
      text-align: center;
    }

    .bracket-wrapper {
      display: flex;
      flex-direction: column;
      gap: 40px;
    }

    .bracket-row {
      display: flex;
      justify-content: space-around;
      align-items: center;
      min-height: 120px;
      padding: 0 50px;
    }

    /* Connector lines - simplified for now */
    .bracket-divider {
      height: 2px;
      background: var(--match-border);
      margin: 10px 0;
    }

    /* No bracket message */
    .no-bracket {
      text-align: center;
      padding: 100px 20px;
      color: var(--text-secondary);
    }

    .no-bracket h2 {
      font-size: 2rem;
      margin-bottom: 20px;
    }

    .no-bracket p {
      font-size: 1.1rem;
    }

    /* Fullscreen button */
    .fullscreen-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: white;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.2s;
    }

    .fullscreen-btn:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    /* Back link */
    .back-link {
      position: fixed;
      top: 20px;
      left: 20px;
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 0.9rem;
      padding: 8px 16px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      transition: all 0.2s;
    }

    .back-link:hover {
      background: rgba(255, 255, 255, 0.2);
      color: var(--text-primary);
    }

    /* SVG connector lines */
    .bracket-svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    .bracket-svg line {
      stroke: var(--match-border);
      stroke-width: 2;
    }

    .match-box {
      position: relative;
      z-index: 1;
    }
  </style>
</head>
<body>
  <a href="index.html" class="back-link">Back to Home</a>

  <div class="bracket-container">
    <header class="bracket-header">
      <h1>Playoff Bracket</h1>
      <span id="connection-status" class="connection-status offline">Checking...</span>
    </header>

    <div id="bracket-content">
      <div class="no-bracket">
        <h2>No Bracket Yet</h2>
        <p>The playoff bracket will appear here once it's generated in the admin panel.</p>
      </div>
    </div>
  </div>

  <button class="fullscreen-btn" onclick="toggleFullscreen()">Fullscreen (F)</button>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

  <!-- App Scripts -->
  <script src="js/firebase-config.js"></script>
  <script src="js/db.js"></script>
  <script src="js/bracket.js"></script>
  <script src="js/bracket-display.js"></script>

  <script>
    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => {
          console.log("Fullscreen error:", err);
        });
      } else {
        document.exitFullscreen();
      }
    }

    document.addEventListener("keydown", (e) => {
      if (e.key === "f" || e.key === "F") {
        toggleFullscreen();
      }
    });
  </script>
</body>
</html>
